name: HermesCompanion
options:
  bundleIdPrefix: com.hermes
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"

targets:
  HermesCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HermesCompanion
    settings:
      base:
        PRODUCT_NAME: "HermesCompanion"
        PRODUCT_BUNDLE_IDENTIFIER: "com.hermes.HermesCompanion"
        INFOPLIST_FILE: "HermesCompanion/Resources/Info.plist"
        CODE_SIGN_ENTITLEMENTS: "HermesCompanion/Resources/HermesCompanion.entitlements"
        CODE_SIGN_STYLE: "Automatic"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        DEVELOPMENT_TEAM: "7H7P2FNJK6"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"
        TARGETED_DEVICE_FAMILY: "1,2"
